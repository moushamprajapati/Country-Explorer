<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Country Explorer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="bgCollage"></div>
<div id="bgOverlay"></div>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="eyebrow">Country Explorer</div>
      <h1>Welcome</h1>
      <p>Log in to explore countries and save your dream destinations.</p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" id="tabLogin" class="active" role="tab">Log in</button>
      <button type="button" id="tabRegister" role="tab">Register</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="auth-form" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Your password">
      </div>
      <label class="show-pw"><input type="checkbox" id="showLoginPw"> Show password</label>
      <div class="form-msg" id="loginMsg" role="alert"></div>
      <button type="submit">Log in</button>
      <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>
    </form>

    <!-- Register form -->
    <form id="registerForm" class="auth-form hidden" novalidate>
      <div class="field">
        <label for="regName">Full name</label>
        <input type="text" id="regName" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="regPassword">Password (min. 6 characters)</label>
        <input type="password" id="regPassword" autocomplete="new-password" placeholder="Create a password">
      </div>
      <div class="field">
        <label for="regConfirm">Confirm password</label>
        <input type="password" id="regConfirm" autocomplete="new-password" placeholder="Type it again">
      </div>
      <div class="field">
        <label for="regQuestion">Security question (for password reset)</label>
        <select id="regQuestion"></select>
      </div>
      <div class="field">
        <label for="regAnswer">Your answer</label>
        <input type="text" id="regAnswer" autocomplete="off" placeholder="Answer to the question above">
      </div>
      <div class="form-msg" id="registerMsg" role="alert"></div>
      <button type="submit">Create account</button>
    </form>

    <!-- Forgot password form (2 steps) -->
    <form id="forgotForm" class="auth-form hidden" novalidate>
      <div class="field">
        <label for="fpEmail">Account email</label>
        <input type="email" id="fpEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div id="fpStep2" class="auth-form hidden">
        <div class="field">
          <label id="fpQuestionLabel" for="fpAnswer">Security question</label>
          <input type="text" id="fpAnswer" autocomplete="off" placeholder="Your answer">
        </div>
        <div class="field">
          <label for="fpNewPw">New password (min. 6 characters)</label>
          <input type="password" id="fpNewPw" autocomplete="new-password">
        </div>
      </div>
      <div class="form-msg" id="fpMsg" role="alert"></div>
      <button type="submit" id="fpBtn">Find my account</button>
      <button type="button" class="link-btn" id="backToLogin">Back to log in</button>
    </form>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
